name: jumptrack
description: JumpTrack - volleyball athlete performance app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  camera: ^0.12.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  firebase_messaging: ^16.1.2
  firebase_storage: ^13.0.2
  google_sign_in: ^6.3.0
  youtube_player_flutter: ^9.1.3
  webview_flutter: ^4.13.1
  fl_chart: ^1.1.1
  table_calendar: ^3.2.0
  flutter_pose_detection: ^0.4.1
  mobile_scanner: ^7.2.0
  http: ^1.2.2
  intl: ^0.20.2
  google_fonts: ^6.3.1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
